services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"

  sonarqube:
    image: sonarqube:10.6-community
    ports:
      - "9001:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-ordem-servico
    ports:
      - "8086:8085"

  api:
    profiles:
      - app
    build:
      context: .
      secrets:
        - nuget_token
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT is required}
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};Maximum Pool Size=15
      Jwt__Funcionario__Issuer: ${JWT_FUNCIONARIO_ISSUER:?JWT_FUNCIONARIO_ISSUER is required}
      Jwt__Funcionario__Audience: ${JWT_FUNCIONARIO_AUDIENCE:?JWT_FUNCIONARIO_AUDIENCE is required}
      Jwt__Funcionario__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM:?JWT_PUBLIC_KEY_PEM is required}
      Jwt__Funcionario__RequireHttpsMetadata: "false"
      Jwt__Cliente__Issuer: ${JWT_CLIENTE_ISSUER:?JWT_CLIENTE_ISSUER is required}
      Jwt__Cliente__Audience: ${JWT_CLIENTE_AUDIENCE:?JWT_CLIENTE_AUDIENCE is required}
      Jwt__Cliente__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM:?JWT_PUBLIC_KEY_PEM is required}
      Jwt__Cliente__RequireHttpsMetadata: "false"
      Administrativo__BaseUrl: ${ADMINISTRATIVO_BASE_URL:-http://host.docker.internal:8080}
      Estoque__BaseUrl: ${ESTOQUE_BASE_URL:-http://host.docker.internal:8082}
      ServiceAuth__Key: ${SERVICE_AUTH_KEY:?SERVICE_AUTH_KEY is required}
      PubSub__ProjectId: local-ordem-servico
      PubSub__UseInMemory: "true"
      PubSub__EnableWorkers: "false"
      PUBSUB_EMULATOR_HOST: pubsub:8085
      DD_SERVICE: ordem-servico-service
      DD_ENV: local
      DD_LOGS_INJECTION: "true"
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      pubsub:
        condition: service_started

secrets:
  nuget_token:
    environment: NUGET_AUTH_TOKEN

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  pgadmin_data:
